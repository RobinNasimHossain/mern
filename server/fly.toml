app = "shoreline-bank-api-82aed7"
primary_region = "iad"

[build]

[env]
  PORT = "4000"
  NODE_ENV = "production"
  CLIENT_ORIGIN = "*"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
